<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>급식 안내</title>
  <style>
    :root {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #f8fafc; background: #081321; font-synthesis: none;
      text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
      --muted: #b6c7d8; --line: rgba(255,255,255,.15);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px; min-height: 100vh; margin: 0; display: grid;
      place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at 15% 8%, rgba(20,184,166,.18), transparent 34rem),
                  radial-gradient(ellipse at 90% 90%, rgba(59,130,246,.16), transparent 38rem), #081321;
    }
    .screen {
      width: min(100vw,177.78vh); min-height: min(100vh,56.25vw);
      padding: clamp(24px,5vw,76px); display: flex; flex-direction: column;
      justify-content: space-between; position: relative; isolation: isolate;
    }
    .screen::before {
      content: ""; position: absolute; inset: 3.2%; border: 1px solid var(--line);
      border-radius: 30px; pointer-events: none; z-index: -1;
    }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 16px; font-size: clamp(17px,2vw,28px); font-weight: 700; letter-spacing: -.04em; }
    .brand-icon {
      width: clamp(44px,5vw,68px); aspect-ratio: 1; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.18); border-radius: 20px;
      background: rgba(255,255,255,.08); font-size: clamp(24px,3vw,40px);
    }
    .live { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: clamp(14px,1.5vw,20px); font-weight: 600; }
    .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 18px rgba(52,211,153,.8); }
    main { width: min(100%,1180px); margin: auto; padding: clamp(30px,6vh,72px) 0; text-align: center; }
    .eyebrow { margin: 0 0 22px; color: #8ca2b8; font-size: clamp(15px,1.8vw,24px); font-weight: 700; letter-spacing: .22em; }
    .message { margin: 0; font-size: clamp(36px,7.2vw,96px); line-height: 1.2; letter-spacing: -.065em; word-break: keep-all; }
    .room { margin: clamp(18px,3vh,34px) 0 0; color: #fff; font-size: clamp(64px,13vw,172px); font-weight: 900; line-height: 1; letter-spacing: -.075em; text-shadow: 0 12px 48px rgba(0,0,0,.3); word-break: keep-all; }
    .status {
      display: inline-flex; align-items: center; gap: 12px; margin-top: clamp(26px,5vh,54px);
      padding: 13px 24px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,255,255,.07); color: #dbeafe; font-size: clamp(16px,2vw,26px); font-weight: 700;
    }
    .status-symbol { font-size: 1.15em; }
    .status.current { color: #bbf7d0; border-color: rgba(74,222,128,.3); background: rgba(22,101,52,.24); }
    .status.next { color: #fde68a; border-color: rgba(250,204,21,.32); background: rgba(133,77,14,.24); }
    .status.waiting { color: #bfdbfe; }
    footer { color: #8ca2b8; font-size: clamp(14px,1.5vw,19px); font-weight: 600; }
    .clock { color: #dbeafe; font-variant-numeric: tabular-nums; font-size: clamp(17px,2vw,25px); }
    @media (max-aspect-ratio: 4/3) {
      .screen { width: 100vw; min-height: 100vh; }
      .screen::before { inset: 14px; border-radius: 22px; }
      header, footer { align-items: flex-start; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand"><span class="brand-icon" aria-hidden="true">🍚</span><span>오늘의 급식 안내</span></div>
      <div class="live"><span class="live-dot" aria-hidden="true"></span>교실 안내 화면</div>
    </header>
    <main>
      <p class="eyebrow">MEAL TIME · 2026년 10월 19일 월요일</p>
      <h1 class="message">다음 순서입니다</h1>
      <p class="room">1학년 2반</p>
      <div class="status next">
        <span class="status-symbol" aria-hidden="true">⏱</span>
        <span>준비해주세요.</span>
      </div>
    </main>
    <footer>
      <span>안전하게 이동하고 맛있게 식사하세요.</span>
      <time class="clock" id="clock"></time>
    </footer>
  </div>
  <script>
    // 기기 내부 시계 표시만 담당합니다. 외부 통신은 하지 않습니다.
    const clockElement = document.querySelector("#clock");
    const updateClock = () => {
      const now = new Date();
      clockElement.dateTime = now.toISOString();
      clockElement.textContent = new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit" }).format(now);
    };
    updateClock();
    window.setInterval(updateClock, 30000);
  </script>
</body>
</html>
